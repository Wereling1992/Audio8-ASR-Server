<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio8 ASR Server</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #e4570e;
      --accent-hover: #ff6b2b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 0.875rem; margin-bottom: 24px; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], input[type="password"], input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      margin-bottom: 16px;
      font-size: 0.95rem;
    }
    input[type="file"] { padding: 8px; cursor: pointer; }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .result {
      margin-top: 24px;
      padding: 16px;
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      min-height: 80px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .meta { margin-top: 8px; font-size: 0.75rem; color: var(--muted); }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Audio8 ASR Server</h1>
    <p class="sub">Multilingual speech recognition · CPU only</p>

    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="x-api-key" value="changeme" />

    <label for="hotwords">Hotwords (optional, comma-separated)</label>
    <input type="text" id="hotwords" placeholder="e.g. Audio8, Edge0" />

    <label for="file">Audio file</label>
    <input type="file" id="file" accept="audio/*,.wav,.mp3,.flac,.ogg,.m4a" />

    <button id="btn" onclick="transcribe()">Transcribe</button>

    <div class="result" id="result">Upload an audio file and click Transcribe.</div>
    <div class="meta" id="meta"></div>
  </div>

  <script>
    async function transcribe() {
      const fileInput = document.getElementById("file");
      const apiKey = document.getElementById("apiKey").value.trim();
      const hotwords = document.getElementById("hotwords").value.trim();
      const btn = document.getElementById("btn");
      const resultEl = document.getElementById("result");
      const metaEl = document.getElementById("meta");

      if (!fileInput.files.length) {
        resultEl.textContent = "Please select an audio file.";
        resultEl.className = "result error";
        return;
      }

      const form = new FormData();
      form.append("audio", fileInput.files[0]);
      if (hotwords) form.append("hotwords", hotwords);

      btn.disabled = true;
      resultEl.textContent = "Transcribing…";
      resultEl.className = "result";
      metaEl.textContent = "";

      try {
        const res = await fetch("/asr", {
          method: "POST",
          headers: { "x-api-key": apiKey },
          body: form,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
        resultEl.textContent = data.text || "(empty)";
        metaEl.textContent = [
          data.elapsed_seconds != null ? `${data.elapsed_seconds}s` : null,
          data.audio_seconds != null ? `audio ${data.audio_seconds}s` : null,
          data.cache_precision ? `cache ${data.cache_precision}` : null,
          data.audio_precision ? `audio ${data.audio_precision}` : null,
        ].filter(Boolean).join(" · ");
      } catch (err) {
        resultEl.textContent = String(err.message || err);
        resultEl.className = "result error";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
